<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para ti ❤️</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: black;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="heartCanvas"></canvas>

    <script>
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');

        function setStyles() {
            ctx.fillStyle = "#ffb6c1";
            ctx.font = "bold 8px Arial";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            setStyles(); 
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let scale = 11;
        let i = 0;

        // --- FUNCIÓN DE DIBUJO ---
        function drawStep() {
            // Mientras no hayamos completado todas las escalas del corazón
            if (scale <= 16) {
                
                // --- CAMBIO CLAVE AQUÍ: AHORA DIBUJAMOS SOLO 1 PUNTO A LA VEZ ---
                // Se eliminó el bucle 'for' que dibujaba 5 puntos, logrando máxima lentitud y suavidad.

                let angle = i * (Math.PI * 2) / 120;

                // Fórmula matemática del corazón
                let x = 16 * Math.pow(Math.sin(angle), 3) * scale;
                let y = (13 * Math.cos(angle) - 5 * Math.cos(2 * angle) - 2 * Math.cos(3 * angle) - Math.cos(4 * angle)) * scale;

                // Centrar en la pantalla (invirtiendo Y porque en HTML Canvas el eje Y baja)
                let screenX = (canvas.width / 2) + x;
                let screenY = (canvas.height / 2) - y;

                // Dibuja el texto "I love you" en rosa claro
                ctx.fillText("I love you", screenX, screenY);

                // Incrementa el índice de ángulo
                i++;

                // Si completamos una vuelta entera (120 puntos)
                if (i >= 120) {
                    i = 0;
                    scale++; // Pasa a la siguiente capa del corazón (escala)
                }

                // Solicita el siguiente fotograma de animación
                requestAnimationFrame(drawStep);
            }
        }

        // Inicia la animación suave
        drawStep();
    </script>
</body>
</html>
