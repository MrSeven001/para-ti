<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para ti ❤️</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: black;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="heartCanvas"></canvas>

    <script>
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let scale = 11;
        let i = 0;

        ctx.fillStyle = "#ffb6c1";
        ctx.font = "bold 8px Arial";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        function drawStep() {
            if (scale <= 16) {
                // Dibuja 5 puntos por cada fotograma para dar animación fluida
                for (let step = 0; step < 5; step++) {
                    if (scale > 16) break;

                    let angle = i * (Math.PI * 2) / 120;

                    // Fórmula matemática del corazón
                    let x = 16 * Math.pow(Math.sin(angle), 3) * scale;
                    let y = (13 * Math.cos(angle) - 5 * Math.cos(2 * angle) - 2 * Math.cos(3 * angle) - Math.cos(4 * angle)) * scale;

                    // Centrar en la pantalla (invirtiendo Y porque en HTML Canvas el eje Y baja)
                    let screenX = (canvas.width / 2) + x;
                    let screenY = (canvas.height / 2) - y;

                    ctx.fillText("I love you", screenX, screenY);

                    i++;
                    if (i >= 120) {
                        i = 0;
                        scale++;
                    }
                }
                requestAnimationFrame(drawStep);
            }
        }

        drawStep();
    </script>
</body>
</html>
