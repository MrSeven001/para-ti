<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para ti ❤️</title>
    <!-- Librería p5.js para gráficos en navegador -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: black;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
    </style>
</head>
<body>
    <script>
        let currentScale = 11;
        let currentI = 0;

        function setup() {
            createCanvas(windowWidth, windowHeight);
            background(0);
            textAlign(CENTER, CENTER);
            textSize(12);
            fill("#ffb6c1");
            textFont("Arial");
        }

        function draw() {
            // Dibuja múltiples puntos por fotograma para dar animación fluida
            for (let step = 0; step < 10; step++) {
                if (currentScale <= 16) {
                    let angle = currentI * (TWO_PI) / 120;

                    // Fórmula del corazón
                    let x = 16 * Math.pow(Math.sin(angle), 3) * currentScale;
                    let y = (13 * Math.cos(angle) - 5 * Math.cos(2 * angle) - 2 * Math.cos(3 * angle) - Math.cos(4 * angle)) * currentScale;

                    // Ajuste al centro de la pantalla (y se invierte la coordenada Y)
                    text("I love you", width / 2 + x, height / 2 - y);

                    currentI++;
                    if (currentI >= 120) {
                        currentI = 0;
                        currentScale++;
                    }
                } else {
                    noLoop(); // Detiene la animación al terminar
                }
            }
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
            background(0);
            currentScale = 11;
            currentI = 0;
            loop();
        }
    </script>
</body>
</html>
